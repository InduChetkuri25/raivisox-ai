name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Keep only the latest run per branch — no history churn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Non-secret CI test settings (see app/config.py defaults; .env is not read in CI).
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-a-real-secret-0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./ci_backend_tests.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API runtime dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          # Declared in apps/api [project.optional-dependencies].dev plus the
          # SQLite async driver and email validation used by tests but not in
          # requirements.txt.
          pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pytest-cov>=4.0.0" \
            "pytest-timeout>=2.3.0" \
            "httpx>=0.27.0" "aiosqlite>=0.20.0" "email-validator>=2.0.0"

      - name: Backend selection sanity (default stays the process backend)
        env:
          SANDBOX_BACKEND: process
        run: >-
          python -c "from services.execution.sandbox import build_default_sandbox,
          ProcessSandbox; assert isinstance(build_default_sandbox(),
          ProcessSandbox)"

      # -x + per-test timeouts: a single wedged test must fail the job with
      # a stack dump (thread method) instead of silently eating the whole
      # step budget; output is tee'd and uploaded as an artifact even when
      # the job is cancelled so the last started test is always evidence.
      - name: Run full suite (live_llm auto-skipped without Ollama)
        # Output goes to a FILE, never through a pipe: a lingering child that
        # inherited stdout can hold a pipe open forever and wedge the step
        # even after pytest itself exits.  timeout+faulthandler are the
        # OS-level backstop for a hang inside a C call, where pytest-timeout's
        # timer thread can never be scheduled; the process listing then shows
        # any survivor that outlived the run.
        run: |
          set +e
          timeout -s ABRT -k 10 900 python -X faulthandler -m pytest \
            -q --timeout=120 --timeout-method=thread > pytest_full.txt 2>&1
          rc=$?
          set -e
          echo "=== full suite pytest exit: $rc ==="
          tail -40 pytest_full.txt || true
          echo "=== surviving processes after pytest ==="
          ps -eo pid,ppid,etimes,stat,args | grep -v grep | head -40 || true
          exit $rc
        timeout-minutes: 25

      - name: Run non-live-LLM selection explicitly
        run: |
          set +e
          timeout -s ABRT -k 10 600 python -X faulthandler -m pytest \
            -m "not live_llm" -q --timeout=120 --timeout-method=thread > pytest_nonlive.txt 2>&1
          rc=$?
          set -e
          echo "=== non-live pytest exit: $rc ==="
          tail -40 pytest_nonlive.txt || true
          exit $rc
        timeout-minutes: 25

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest_*.txt
          if-no-files-found: ignore

      - name: Clean up CI test database
        if: always()
        run: rm -f ./ci_backend_tests.db

  postgres-gate:
    name: PostgreSQL gate (real server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PostgreSQL evidence cannot be inferred from SQLite: migration 003, the
    # audit/link transaction, the foreign keys and the restart behaviour are
    # exercised here against a real server (V3 Phase 1 spec §7.6, R11).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raivisox_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raivisox_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-a-real-secret-0123456789abcdef
      RAIVISOX_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/raivisox_v3_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API runtime dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pytest-cov>=4.0.0" \
            "pytest-timeout>=2.3.0" \
            "httpx>=0.27.0" "aiosqlite>=0.20.0" "email-validator>=2.0.0"

      # The tests create and drop their own databases, so the role needs
      # CREATEDB (the postgres superuser has it). A skip here means the gate
      # proved nothing: fail the job instead of passing silently.
      - name: Run PostgreSQL-gated tests (any skip fails the gate)
        run: |
          set -o pipefail
          pytest tests/unit/test_migration_003.py tests/unit/test_postgres_phase1.py \
            -q -rs --timeout=300 | tee postgres_gate_results.txt
          if grep -qE 'skipped|SKIPPED' postgres_gate_results.txt; then
            echo '::error::PostgreSQL tests skipped although the server is available - treating as gate failure'
            exit 1
          fi
          grep -qE '[0-9]+ passed' postgres_gate_results.txt \
            || { echo '::error::no PostgreSQL tests ran'; exit 1; }
        timeout-minutes: 15

      - name: Upload PostgreSQL gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-gate-diagnostics
          path: postgres_gate_results.txt
          if-no-files-found: ignore

  container-gate:
    name: Container sandbox gate (live Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-a-real-secret-0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./ci_container_gate.db
      # The container gate runs the REAL backend with the container backend
      # selected exactly as production config would (docs/sandbox-design.md §3).
      SANDBOX_BACKEND: container
      # Digest-pinned (not a mutable tag): the gate must execute the same
      # bytes every run. The digest is the Docker Hub manifest-list digest
      # resolved 2026-10-20 and must match
      # services/execution/image_pins.py::APPROVED_IMAGES — a unit test
      # asserts the two agree, so a half-updated pin fails locally.
      SANDBOX_CONTAINER_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Prove the container runtime is usable (job fails if not)
        run: |
          docker version --format 'server={{ .Server.Version }} client={{ .Client.Version }}'
          docker info > /dev/null
          echo "Docker is installed, the daemon responds, and a container can run:"
          docker run --rm "${SANDBOX_CONTAINER_IMAGE}" true \
            || { echo '::error::basic container failed to start'; exit 1; }

      - name: Diagnose host spawn with/without preexec_fn (A/B evidence)
        run: |
          python - <<'PY'
          import asyncio, sys, os

          def preexec():
              pass

          async def try_spawn(label, **kw):
              try:
                  p = await asyncio.create_subprocess_exec(
                      sys.executable, "-c", "print('ok')",
                      stdout=asyncio.subprocess.PIPE,
                      stderr=asyncio.subprocess.PIPE, **kw)
                  out, err = await p.communicate()
                  print(f"{label}: OK rc={p.returncode} out={out!r} err={err!r}")
              except BaseException as e:
                  print(f"{label}: FAIL {type(e).__name__}: {e}")

          async def main():
              print("python", sys.version)
              print("posix", os.name == "posix")
              await try_spawn("plain")
              await try_spawn("preexec_noop", preexec_fn=preexec)
              await try_spawn("cwd_tmp", cwd="/tmp")
              await try_spawn("env_min", env={"PATH": os.environ.get("PATH", "/usr/bin")})
              await try_spawn("preexec+cwd+env", preexec_fn=preexec,
                              cwd="/tmp", env={"PATH": os.environ.get("PATH", "/usr/bin")})

          asyncio.run(main())
          PY

      - name: Pull the sandbox image (tests only inspect, they never pull)
        run: docker pull "${SANDBOX_CONTAINER_IMAGE}"

      - name: Install API runtime dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pytest-cov>=4.0.0" \
            "pytest-timeout>=2.3.0" \
            "httpx>=0.27.0" "aiosqlite>=0.20.0" "email-validator>=2.0.0"

      # Authoritative live-container verification (docs/sandbox-design.md §9):
      # backend-level security tests AND the real RAIVISOX paths
      # (python_exec / shell_exec / codegen / DoD through the kernel-gated
      # registry) inside actual containers. A runtime was proven above, so a
      # skip here means the gate is broken — fail the job, never pass silently.
      - name: Run live container tests (-m live; any skip fails the gate)
        run: |
          set -o pipefail
          pytest tests/unit/test_sandbox_phase4.py tests/unit/test_container_app_path.py tests/unit/test_sandbox_phase5.py \
            -m live -q -rs | tee live_container_results.txt
          if grep -qE 'skipped|SKIPPED' live_container_results.txt; then
            echo '::error::Live container tests skipped although the runtime was proven usable - treating as gate failure'
            exit 1
          fi
          grep -qE '[0-9]+ passed' live_container_results.txt \
            || { echo '::error::no live tests ran'; exit 1; }
        timeout-minutes: 15

      - name: Container-backend static/unit tests (non-live half)
        run: |
          set +e
          timeout -s ABRT -k 10 420 python -X faulthandler -m pytest \
            tests/unit/test_sandbox_phase4.py tests/unit/test_container_app_path.py tests/unit/test_sandbox_phase5.py \
            -m "not live" -q --timeout=120 --timeout-method=thread > container_nonlive_results.txt 2>&1
          rc=$?
          set -e
          echo "=== non-live container pytest exit: $rc ==="
          tail -40 container_nonlive_results.txt || true
          echo "=== surviving processes after pytest ==="
          ps -eo pid,ppid,etimes,stat,args | grep -v grep | head -40 || true
          exit $rc
        timeout-minutes: 10

      - name: Upload container gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-gate-diagnostics
          path: |
            live_container_results.txt
            container_nonlive_results.txt
          if-no-files-found: ignore

      - name: Clean up CI test database
        if: always()
        run: rm -f ./ci_container_gate.db

  frontend-validation:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: apps/web
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: No secrets in build output
        working-directory: apps/web
        run: |
          ! grep -rIn --include='*.js' --include='*.html' -E \
            '(sk-ant-[A-Za-z0-9]|sk-proj-[A-Za-z0-9]{20}|SECRET_KEY\s*=)' \
            .next/static .next/server .next/server/app
