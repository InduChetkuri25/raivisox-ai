name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Keep only the latest run per branch — no history churn.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Non-secret CI test settings (see app/config.py defaults; .env is not read in CI).
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-not-a-real-secret-0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./ci_backend_tests.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API runtime dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          # Declared in apps/api [project.optional-dependencies].dev plus the
          # SQLite async driver and email validation used by tests but not in
          # requirements.txt.
          pip install "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pytest-cov>=4.0.0" \
            "httpx>=0.27.0" "aiosqlite>=0.20.0" "email-validator>=2.0.0"

      - name: Run full suite (live_llm auto-skipped without Ollama)
        run: pytest -q
        timeout-minutes: 25

      - name: Run non-live-LLM selection explicitly
        run: pytest -m "not live_llm" -q
        timeout-minutes: 25

      - name: Clean up CI test database
        if: always()
        run: rm -f ./ci_backend_tests.db

  frontend-validation:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: apps/web
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: No secrets in build output
        working-directory: apps/web
        run: |
          ! grep -rIn --include='*.js' --include='*.html' -E \
            '(sk-ant-[A-Za-z0-9]|sk-proj-[A-Za-z0-9]{20}|SECRET_KEY\s*=)' \
            .next/static .next/server .next/server/app
