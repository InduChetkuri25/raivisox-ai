version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: raivisox-postgres
    environment:
      POSTGRES_USER: raivisox
      POSTGRES_PASSWORD: raivisox_password
      POSTGRES_DB: raivisox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raivisox -d raivisox"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - raivisox-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: raivisox-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - raivisox-network

  # FastAPI Backend
  api:
    build:
      # Repo root: the API imports the repo-level services.* / integrations.*
      # packages (see apps/api/Dockerfile).
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: raivisox-api
    environment:
      - APP_NAME=RAIVISOX AI API
      - APP_VERSION=0.1.0
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://raivisox:raivisox_password@postgres:5432/raivisox
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production-please
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:3000
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - LOG_LEVEL=INFO
      - DEFAULT_EXECUTION_MODE=balanced
      - DEFAULT_TASK_TIMEOUT=300
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      # Repo-level packages the API imports; mounted so --reload keeps working
      # with the same layout the production image uses.
      - ./services:/app/services
      - ./integrations:/app/integrations
    command: >
      sh -c "pip install -r requirements.txt &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - raivisox-network

  # Next.js Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: raivisox-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - raivisox-network

volumes:
  postgres_data:
  redis_data:

networks:
  raivisox-network:
    driver: bridge
